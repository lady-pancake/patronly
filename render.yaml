# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New > Blueprint > pick this repo. Secrets marked sync:false are
# entered in the Render dashboard, never committed.
services:
  - type: web
    name: patronly-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # Free instances have no pre-deploy step, so migrations run on start.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
