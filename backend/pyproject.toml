[project]
name = "patronly-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Vercel installs these from here; keep in sync with requirements.txt.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "strawberry-graphql[fastapi]>=0.250",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "PyJWT>=2.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
